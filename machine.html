let LANG='ko', SRC='all', DLV='all', PMODE='po', CHB='all';
const uC=v=>{const u=(v||0)/RATE;if(Math.abs(u)>=1e6)return '$'+(u/1e6).toFixed(2)+'M';if(Math.abs(u)>=1e3)return '$'+(u/1e3).toFixed(1)+'K';return '$'+Math.round(u);};
const uF=v=>'$'+Math.round((v||0)/RATE).toLocaleString('en-US');  /* 상단 KPI 카드 1달러 단위 full 표기 */
const rp=v=>{v=v||0;if(Math.abs(v)>=1e9)return 'Rp '+(v/1e9).toFixed(2)+'B';if(Math.abs(v)>=1e6)return 'Rp '+(v/1e6).toFixed(1)+'M';return 'Rp '+Math.round(v).toLocaleString('en-US');};
const nf=n=>Math.round(n||0).toLocaleString('en-US');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const q1=s=>(s||'').replace(/'/g,"");
const T=(ko,en)=>LANG==='ko'?ko:en;
const cmonth=r=>r[14]?r[14].slice(0,7).replace('-','.'):'';
const monthOf=r=>PMODE==='po'?r[3]:cmonth(r);
function mv(v){if(v==null)return '-';return `<span class="mcell"><b>$${nf(Math.round((v||0)/RATE))}</b><span>Rp ${nf(Math.round(v||0))}</span></span>`;}
function costTot(r){return r[12]!=null?Math.round(r[13]*(1-r[12])):(r[10]!=null?Math.round(r[10]*(r[8]||0)):null);}
const abbr=s=>{const t=(s||'').trim().split(/\s+/);if(t[0]&&/^(PT|CV|UD|PD|FA)[.,]?$/i.test(t[0]))return t[0].replace(/[.,]/g,'').toUpperCase()+'.'+(t[1]||'');return t.slice(0,2).join(' ');};
function curPO(){return SRC==='all'?PO:PO.filter(r=>r[0]===SRC);}
function curRFQ(){return SRC==='all'?RFQ:RFQ.filter(r=>r[0]===SRC);}
function setLang(l){LANG=l;document.getElementById('lko').classList.toggle('on',l==='ko');document.getElementById('len').classList.toggle('on',l==='en');render();}
function setSrc(s){SRC=s;render();}
function setDlv(d){DLV=d;renderPO();}
function srcTag(s){return `<span class="tag ${s==='공무'?'t2':'t1'}">${s==='공무'?T('공무','MEP'):T('비관계사','NR')}</span>`;}
function poStat(r){if(r[14])return `<span class="dv">✔ ${T('납품완료','Delivered')} ${r[14]}</span>`;if(r[15]==='X')return `<span class="nd">${T('미납품','Undeliv')}${r[16]!=null?' ('+r[16]+T('일','d')+')':''}</span>`;if(r[19])return `<span class="pg">${esc(r[19])}</span>`;return `<span class="pg">${T('확인필요','Check')}</span>`;}

function renderCards(){
 const P=curPO().filter(r=>POM==='all'||monthOf(r)===POM);
 const R=(PMODE==='po')?curRFQ().filter(r=>POM==='all'||r[3]===POM):curRFQ();
 const custs=new Set(P.map(r=>r[1]));
 const poAmt=P.reduce((s,r)=>s+r[13],0);
 const dl=P.filter(r=>r[14]); const delivAmt=dl.reduce((s,r)=>s+r[13],0);
 const und=P.filter(r=>r[15]==='X').length;
 const qty=P.reduce((s,r)=>s+(r[8]||0),0);
 const submitAmt=R.reduce((s,r)=>s+(r[13]||0),0);
 const basisLbl=PMODE==='po'?T('PO접수월 기준','By PO month'):T('납품월 기준','By delivery month');
 const periodLbl=(POM==='all'?T('누계(전체 대상월)','Cumulative (all months)'):POM)+' · '+basisLbl;
 const cards=[
  [T('기계 PO 아이템수','Machine PO items'),nf(P.length),T('총 수량 '+nf(qty),'qty '+nf(qty))],
  [T('거래 고객사','Customers'),nf(custs.size),T('개사','cos')],
  [T('PO 접수금액','PO intake'),uF(poAmt),rp(poAmt)],
  [T('납품완료 매출','Delivered'),uF(delivAmt),T(nf(dl.length)+'건 · '+rp(delivAmt),nf(dl.length)+' · '+rp(delivAmt))],

  c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF12294C'}};
  c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=_XB;});
 const num=sp.numCols||[],pct=sp.pctCols||[];
 let ri=4;
 const put=(vals,tot)=>{const row=ws.getRow(ri++);
  vals.forEach((v,i)=>{const c=row.getCell(i+1);c.value=v;
